name: Build CV

on:
  push:
    branches: [main]
    paths: [cv.typ, .github/workflows/cv.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - run: typst compile cv.typ cv.pdf

      # Commit back so branch-based GitHub Pages serves cv.pdf; GITHUB_TOKEN pushes don't retrigger workflows.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git diff --cached --quiet || { git commit -m "build cv.pdf"; git push; }
